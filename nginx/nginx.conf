worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Пул из двух одинаковых backend-нод. По умолчанию nginx распределяет
    # запросы round-robin — по очереди на backend-1 и backend-2.
    upstream backend_pool {
        server backend-1:8000;
        server backend-2:8000;
    }

    server {
        listen 80;
        server_name _;

        # Все запросы к API уходят через балансировщик на одну из двух нод backend.
        location /api/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Статические файлы фронтенда отдаются напрямую самим Nginx.
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
