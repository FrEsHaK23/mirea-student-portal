services:
  backend-1:
    build: ./backend
    container_name: mirea-backend-1
    environment:
      - INSTANCE_ID=backend-1
      - DATA_DIR=/app/data
    volumes:
      # Bind mount на общий каталог с хоста — обе ноды backend читают
      # и пишут одни и те же файлы. Если одна нода упадёт, данные
      # остаются доступны на диске хоста и второй ноде.
      - ./backend/data:/app/data
    restart: always

  backend-2:
    build: ./backend
    container_name: mirea-backend-2
    environment:
      - INSTANCE_ID=backend-2
      - DATA_DIR=/app/data
    volumes:
      - ./backend/data:/app/data
    restart: always

  nginx:
    image: nginx:1.27-alpine
    container_name: mirea-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
    restart: always
